services:

  # ── Database ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ecg-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ecg-net
      
  seed:
    build: ./seed
    container_name: ecg-seed
    environment:
      MONGO_URI: mongodb://mongo:27017/ecgdb
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./seed/mitbih_test.csv:/data/mitbih_test.csv:ro
    depends_on:
      - mongo
    networks:
      - ecg-net
    restart: "no"
    
  # ── Prediction Service ───────────────────────────────────────────────────────
  prediction-service:
    build: ./prediction-service
    container_name: ecg-prediction
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/ecgdb
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./prediction-service/models:/app/models:ro
    depends_on:
      - mongo
    networks:
      - ecg-net

  # ── History Service ──────────────────────────────────────────────────────────
  history-service:
    build: ./history-service
    container_name: ecg-history
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/ecgdb
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - mongo
    networks:
      - ecg-net

# ── Frontend (Nginx + HTTPS) ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    environment:
      - NGINX_MODE=${NGINX_MODE}
      - SERVER_NAME=${SERVER_NAME}
    volumes:
      - ${CERTBOT_PATH}:/etc/letsencrypt:ro
    networks:
      - ecg-net
    ports:
      - "80:80"
      - "443:443"

# ── Certbot (rinnovo automatico certificati) ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: ecg-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet --webroot -w /var/www/certbot; done'"
# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  mongo_data:

networks:
  ecg-net:
    driver: bridge