server {
    listen 80;
    server_name ecg.heremy.link;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ecg.heremy.link;

    ssl_certificate     /etc/letsencrypt/live/ecg.heremy.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecg.heremy.link/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/predict/ {
        proxy_pass http://prediction-service:8000/predict/;
    }

    location /api/history/ {
        proxy_pass http://history-service:8001/history/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}